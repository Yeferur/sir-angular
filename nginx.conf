# Configuración Nginx para Sir-Angular en VPS
# Ubicar en: /etc/nginx/sites-available/sir-angular
# Luego enlazar: sudo ln -s /etc/nginx/sites-available/sir-angular /etc/nginx/sites-enabled/

upstream backend {
    server localhost:5000;
}

upstream websocket {
    server localhost:6000;
}

server {
    listen 80;
    listen [::]:80;
    server_name sir.viajesmaxitours.co;  # Cambiar si el dominio final es distinto

    root /var/www/sir-angular;
    index index.html;

    # Frontend - Angular standalone build
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Backend
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Archivos estáticos (uploads)
    location /uploads {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket
    location /ws {
        proxy_pass http://websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

