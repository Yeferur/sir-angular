<div class="multi-filter">
  <button type="button" class="multi-filter-trigger"
    [id]="resolvedInputId"
    [class.active]="isOpen"
    [class.multi-filter-trigger-active]="value.length > 0"
    [disabled]="effectivelyDisabled"
    [attr.aria-label]="ariaLabel"
    aria-haspopup="listbox"
    [attr.aria-controls]="isOpen ? resolvedListId : null"
    [attr.aria-expanded]="isOpen"
    (click)="toggle()">
    <span>{{ selectionText }}</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>
  @if (isOpen) {
    <div class="multi-filter-menu" [id]="resolvedListId" role="listbox"
      [attr.aria-label]="ariaLabel ? ariaLabel + ' opciones' : null" aria-multiselectable="true">
      @for (option of options; track option.value) {
        <button type="button" class="multi-filter-option" role="option"
          [disabled]="option.disabled"
          [attr.aria-selected]="isSelected(option.value)"
          (click)="toggleOption(option)">
          <span class="multi-filter-checkbox" [class.checked]="isSelected(option.value)" aria-hidden="true">
            @if (isSelected(option.value)) {
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            }
          </span>
          <span>{{ option.label }}</span>
        </button>
      }
      <button type="button" class="multi-filter-clear" [disabled]="effectivelyDisabled || !value.length" (click)="clear()">
        Limpiar selección
      </button>
    </div>
  }
</div>
