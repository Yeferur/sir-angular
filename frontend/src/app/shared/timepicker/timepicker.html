<button
  #triggerButton
  type="button"
  class="sir-tp-field"
  [id]="resolvedInputId"
  [class.is-open]="isOpen"
  [class.is-invalid]="invalid"
  [class.is-disabled]="disabled"
  [class.is-readonly]="readOnly"
  [attr.aria-expanded]="isOpen"
  [attr.aria-haspopup]="'dialog'"
  [attr.aria-invalid]="invalid || null"
  [attr.aria-labelledby]="ariaLabelledby"
  [attr.aria-describedby]="ariaDescribedby"
  [attr.aria-description]="value ? displayText : placeholder"
  [attr.aria-label]="ariaLabelledby ? null : (value ? displayText : placeholder)"
  [disabled]="disabled || null"
  (click)="toggle()"
>
  <svg class="sir-tp-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="9"/>
    <polyline points="12 7 12 12 15.5 14"/>
  </svg>
  <span class="sir-tp-text" [class.placeholder]="!value">{{ value ? displayText : placeholder }}</span>
  @if (!readOnly) {
    <i class="bx bx-chevron-down sir-tp-caret" [class.rotated]="isOpen" aria-hidden="true"></i>
  }
</button>

<ng-template #panelTpl>
  <div class="sir-tp-panel" [class.sir-tp-panel--free]="mode === 'free'" role="dialog" aria-modal="true" aria-label="Seleccionar hora">
    @if (mode === 'free') {
      <div class="sir-tp-free">
        <div class="sir-tp-time-row">
          <label>
            <input #freeHourInput class="form-input sir-tp-number" type="text" inputmode="numeric" autocomplete="off"
              maxlength="2" [value]="draftHour" aria-label="Hora, de 1 a 12"
              (input)="updateDraftHour($event)" (blur)="normalizeFreeInput('hour')"
              (keydown)="onFreeInputKeydown($event, 'hour')" />
          </label>
          <span class="sir-tp-separator" aria-hidden="true">:</span>
          <label>
            <input #freeMinuteInput class="form-input sir-tp-number" type="text" inputmode="numeric" autocomplete="off"
              maxlength="2" [value]="draftMinute" aria-label="Minutos, de 00 a 59"
              (input)="updateDraftMinute($event)" (blur)="normalizeFreeInput('minute')"
              (keydown)="onFreeInputKeydown($event, 'minute')" />
          </label>
          <div class="sir-tp-period" role="group" aria-label="Periodo del día">
            <button #periodAmButton type="button" [class.active]="draftPeriod === 'AM'" [attr.aria-pressed]="draftPeriod === 'AM'" (keydown)="onPeriodKeydown($event)" (click)="setDraftPeriod('AM')">a. m.</button>
            <button #periodPmButton type="button" [class.active]="draftPeriod === 'PM'" [attr.aria-pressed]="draftPeriod === 'PM'" (keydown)="onPeriodKeydown($event)" (click)="setDraftPeriod('PM')">p. m.</button>
          </div>
        </div>
        @if (freeError) { <p class="sir-tp-error" role="alert">{{ freeError }}</p> }
      </div>
    } @else {
      <div class="sir-tp-list" #slotList role="listbox" aria-label="Horarios disponibles">
        @for (slot of slots; track trackBySlot($index, slot)) {
          <button type="button" class="sir-tp-item" role="option"
            [class.is-selected]="value === slot" [disabled]="isSlotDisabled(slot) || null"
            [attr.aria-selected]="value === slot" (click)="selectSlot(slot)"
            (keydown)="onSlotKeydown($event, $index)">{{ slotLabel(slot) }}</button>
        }
      </div>
    }
  </div>
</ng-template>
