<!--
========================================
LOGIN — SIR Angular
Diseño coherente con el sistema de cards de la app.
========================================
-->
<div class="login-view-container">
  <div class="login-card">

    <!-- Línea de acento azul superior -->
    <div class="card-accent"></div>

    <div class="card-body">

      <!-- CABECERA -->
      <div class="login-header">
        @if (isDarkMode) {
          <!-- Opción A: Logo real -->
          <img src="assets/img/LogoMaxitoursPNG.webp" alt="Maxitours" class="logo">
        } @else {
          <img src="assets/img/LogoMaxitours-Light.webp" alt="Maxitours" class="logo">
        }
        <div class="brand-sub">Sistema Integrado de Reservas</div>
      </div>

      <!-- FORMULARIO -->
      <form class="login-form" (ngSubmit)="login()">

        <!-- Usuario -->
        <div class="form-group">
          <label for="username" class="form-label">Usuario o Correo</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input
              id="username"
              type="text"
              class="form-input"
              [(ngModel)]="username"
              name="username"
              placeholder="usuario o correo"
              autocomplete="username"
              required>
          </div>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-wrap password-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-input pw-input"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required>
            <button
              type="button"
              class="toggle-password"
              (click)="showPassword = !showPassword"
              aria-label="Mostrar u ocultar contraseña">
              <!-- Ojo normal -->
              @if (!showPassword) {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                  viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              }
              <!-- Ojo tachado -->
              @if (showPassword) {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                  viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.27-2.944-9.544-7a10.05 10.05 0 012.184-3.272m1.768-1.768A9.956 9.956 0 0112 5c4.477 0 8.268 2.943 9.542 7a9.956 9.956 0 01-4.308 5.066M15 12a3 3 0 00-3-3m0 0a3 3 0 013 3m-3-3v.01M3 3l18 18"/>
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Error -->
        @if (error) {
          <div class="error-message" role="alert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            {{ error }}
          </div>
        }

        <!-- Botón submit -->
        <button type="submit" class="btn-primary" [disabled]="isLoading">
          @if (!isLoading) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            <span>Iniciar Sesión</span>
          }
          @if (isLoading) {
            <div class="spinner-small"></div>
          }
        </button>

      </form>
    </div>

    <!-- FOOTER -->
    <div class="card-footer">
      <a routerLink="/forgot-password" class="forgot-password-link">
        ¿Olvidaste tu contraseña?
      </a>
      <span class="version-tag">SIR v2 · Maxitours</span>
    </div>

  </div>
</div>
