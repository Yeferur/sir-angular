<div class="duplicar-panel">
  <h3>Duplicar Reserva</h3>
  <p>Selecciona Tour y Fecha para la nueva reserva:</p>

  <div class="field">
    <label for="duplicar-reserva-tour">Tour</label>
    <app-select inputId="duplicar-reserva-tour" [options]="tours | selectOptions:'Id_Tour':'Nombre_Tour':true"
      [compareWith]="compareSelectValues" placeholder="Seleccione un tour" [required]="true"
      [ngModel]="Id_Tour()" (ngModelChange)="onTourChange($event)" />
  </div>

  <div class="field">
    <label>Fecha</label>
    <app-datepicker
      [ngModel]="Fecha_Tour()"
      (ngModelChange)="Fecha_Tour.set($event)"
      [minDate]="minFecha"
      [dateFilter]="dateFilterFn"
      placeholder="Seleccione una fecha"
    ></app-datepicker>
  </div>

  <div class="field">
    <label>Observaciones (opcional)</label>
    <textarea
      class="form-input"
      rows="4"
      [ngModel]="Observaciones()"
      (ngModelChange)="Observaciones.set($event)"
      placeholder="Anota aquí comentarios u observaciones para la nueva reserva..."
    ></textarea>
  </div>

  @if (errorMsg()) {
    <div class="error-message">{{ errorMsg() }}</div>
  }

  <div class="actions">
    <button type="button" (click)="confirmar()" class="btn-primary" [disabled]="isSubmitting() || !isValid()">Confirmar</button>
    <button type="button" (click)="cancelar()" class="btn-secondary" [disabled]="isSubmitting()">Cancelar</button>
  </div>
</div>
