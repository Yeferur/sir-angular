<app-layout></app-layout>
<!-- El host es global: también debe sobrevivir al logout y a las rutas públicas. -->
<app-sir-alerts></app-sir-alerts>

@if (viewLoggedIn()) {
  <div class="app-shell app-shell--private"
       [class.is-entering]="shellEntering()"
       [class.is-navigating]="routeTransitioning">
    <app-sir-drawer></app-sir-drawer>
    <div class="main-shell">
      <main class="content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
} @else if (publicAuthRoute) {
  <main class="auth-public-shell">
    @if (!routeTransitioning) {
      <router-outlet></router-outlet>
    }
  </main>
}
<!-- El login por defecto (ni privado ni /reset-password) ya no se monta
     aquí aparte: vive dentro de <app-layout>, anidado en la misma caja
     del topbar que se expande a pantalla completa. Ver
     LayoutComponent.showAuthSlot / .topbar-auth-slot en layout.html. -->
