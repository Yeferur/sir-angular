@if (loggedIn) {
  <div class="app-shell app-shell--private">
    <app-sir-alerts></app-sir-alerts>
    <app-sir-drawer></app-sir-drawer>
    <app-layout></app-layout>
    <div class="main-shell">
      <main class="content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
} @else if (publicAuthRoute) {
  <main class="auth-public-shell">
    @if (!routeTransitioning) {
      <router-outlet></router-outlet>
    }
  </main>
} @else {
  <main class="auth-public-shell">
    @if (!routeTransitioning) {
      <app-login></app-login>
    }
  </main>
}
