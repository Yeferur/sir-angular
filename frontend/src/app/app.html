@if (loggedIn) {
  <div class="app-shell app-shell--private">
    <app-sidebar></app-sidebar>
    <div class="main-shell">
      <app-dynamic-navbar></app-dynamic-navbar>
      <main class="content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
} @else if (publicAuthRoute) {
  <main class="auth-public-shell">
    <router-outlet></router-outlet>
  </main>
} @else {
  <div class="app-shell app-shell--login">
    <div class="main-shell main-shell--login">
      <app-dynamic-navbar></app-dynamic-navbar>
    </div>
  </div>
}
