@if (viewModel(); as cupo) {
  <article class="aforo-card" [ngClass]="cupo.estado">
    <div class="aforo-progress-bar">
      <div
        class="aforo-progress-fill"
        [ngClass]="cupo.estado"
        [style.width.%]="cupo.ocupacionPorcentaje">
      </div>
    </div>

    <header class="aforo-header">
      <div class="tour-title-group">
        <h3 class="tour-name" [title]="cupo.nombreTour">
          {{ cupo.nombreTour }}
        </h3>
      </div>

      <span class="status-pill" [ngClass]="cupo.estado">
        {{ cupo.ocupacionPorcentaje | number:'1.0-0' }}% lleno
      </span>
    </header>

    <div class="aforo-body">
      <div class="aforo-main-metric">
        <span class="big-number">{{ cupo.cuposDisponibles }}</span>
        <span class="big-label">disponibles</span>
      </div>

      <div class="aforo-side-metrics">
        <div class="side-metric">
          <span class="side-value">{{ cupo.ocupados }}</span>
          <span class="side-label">Ocupados</span>
        </div>

        <div class="side-metric">
          <span class="side-value">{{ cupo.cupoTotal }}</span>
          <span class="side-label">Capacidad</span>
        </div>
      </div>
    </div>

  </article>
} @else {
  <article class="aforo-card is-empty" aria-live="polite">
    <header class="aforo-header">
      <div class="tour-title-group">
        <h3 class="tour-name">Cupos</h3>
      </div>
    </header>

    <div class="empty-state">
      <strong>No hay cupos disponibles para mostrar</strong>
    </div>
  </article>
}
